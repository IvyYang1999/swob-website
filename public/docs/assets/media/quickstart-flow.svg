<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Swob 十分钟快速入门流程</title>
  <desc id="desc">从选择 Library、等待扫描、打开会话、搜索原文到安全续接的五步流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17151b"/>
      <stop offset="1" stop-color="#211a2b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" fill="#f4f0f7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="700">第一次成功，不是“安装完成”</text>
  <text x="64" y="110" fill="#aaa2b5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">目标：找到一段真实历史，读懂它，并确认是否能够继续</text>
  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(64 158)">
      <rect width="184" height="126" rx="16" fill="#26212d" stroke="#4d4258"/>
      <circle cx="28" cy="28" r="16" fill="#8b5cf6"/><text x="28" y="34" text-anchor="middle" fill="white" font-size="15" font-weight="700">1</text>
      <text x="22" y="75" fill="#f4f0f7" font-size="20" font-weight="650">选择 Library</text>
      <text x="22" y="104" fill="#aaa2b5" font-size="15">确认来源范围</text>
    </g>
    <path d="M258 221h38" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/><path d="m288 213 9 8-9 8" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <g transform="translate(306 158)">
      <rect width="184" height="126" rx="16" fill="#26212d" stroke="#4d4258"/>
      <circle cx="28" cy="28" r="16" fill="#8b5cf6"/><text x="28" y="34" text-anchor="middle" fill="white" font-size="15" font-weight="700">2</text>
      <text x="22" y="75" fill="#f4f0f7" font-size="20" font-weight="650">等待首次扫描</text>
      <text x="22" y="104" fill="#aaa2b5" font-size="15">侧栏出现会话</text>
    </g>
    <path d="M500 221h38" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/><path d="m530 213 9 8-9 8" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <g transform="translate(548 158)">
      <rect width="184" height="126" rx="16" fill="#26212d" stroke="#4d4258"/>
      <circle cx="28" cy="28" r="16" fill="#8b5cf6"/><text x="28" y="34" text-anchor="middle" fill="white" font-size="15" font-weight="700">3</text>
      <text x="22" y="75" fill="#f4f0f7" font-size="20" font-weight="650">打开熟悉会话</text>
      <text x="22" y="104" fill="#aaa2b5" font-size="15">核对来源与正文</text>
    </g>
    <path d="M742 221h38" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/><path d="m772 213 9 8-9 8" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <g transform="translate(790 158)">
      <rect width="154" height="126" rx="16" fill="#26212d" stroke="#4d4258"/>
      <circle cx="28" cy="28" r="16" fill="#8b5cf6"/><text x="28" y="34" text-anchor="middle" fill="white" font-size="15" font-weight="700">4</text>
      <text x="22" y="75" fill="#f4f0f7" font-size="20" font-weight="650">搜索原文</text>
      <text x="22" y="104" fill="#aaa2b5" font-size="15">跳回命中轮次</text>
    </g>
    <path d="M954 221h38" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/><path d="m984 213 9 8-9 8" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <g transform="translate(1002 158)">
      <rect width="134" height="126" rx="16" fill="#2b2138" stroke="#8b5cf6"/>
      <circle cx="28" cy="28" r="16" fill="#8b5cf6"/><text x="28" y="34" text-anchor="middle" fill="white" font-size="15" font-weight="700">5</text>
      <text x="22" y="75" fill="#f4f0f7" font-size="20" font-weight="650">安全续接</text>
      <text x="22" y="104" fill="#c4b5fd" font-size="15">来源允许时</text>
    </g>
  </g>
</svg>
