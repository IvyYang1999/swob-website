<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Swob 故障定位路径</title>
  <desc id="desc">按来源、Library、索引、展示和行动五层定位问题。</desc>
  <rect width="1200" height="520" rx="32" fill="#fbf9ff"/>
  <text x="70" y="76" fill="#211a2c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">先判断在哪一层失败，再做最小修复</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(70 145)"><rect width="190" height="235" rx="22" fill="#fff" stroke="#ded8e8"/><text x="28" y="48" fill="#6d28d9" font-size="14" font-weight="700">01 SOURCE</text><text x="28" y="92" fill="#211a2c" font-size="23" font-weight="700">原客户端</text><text x="28" y="132" fill="#6d6478" font-size="16">源文件还在？</text><text x="28" y="164" fill="#6d6478" font-size="16">来源被排除？</text><text x="28" y="196" fill="#6d6478" font-size="16">格式受支持？</text></g>
    <path d="M272 262h32" stroke="#9b8bb4" stroke-width="3"/><path d="m296 254 12 8-12 8" fill="none" stroke="#9b8bb4" stroke-width="3"/>
    <g transform="translate(320 145)"><rect width="190" height="235" rx="22" fill="#fff" stroke="#ded8e8"/><text x="28" y="48" fill="#6d28d9" font-size="14" font-weight="700">02 LIBRARY</text><text x="28" y="92" fill="#211a2c" font-size="23" font-weight="700">本地事实层</text><text x="28" y="132" fill="#6d6478" font-size="16">扫描完成？</text><text x="28" y="164" fill="#6d6478" font-size="16">写入健康？</text><text x="28" y="196" fill="#6d6478" font-size="16">副本存在？</text></g>
    <path d="M522 262h32" stroke="#9b8bb4" stroke-width="3"/><path d="m546 254 12 8-12 8" fill="none" stroke="#9b8bb4" stroke-width="3"/>
    <g transform="translate(570 145)"><rect width="190" height="235" rx="22" fill="#fff" stroke="#ded8e8"/><text x="28" y="48" fill="#6d28d9" font-size="14" font-weight="700">03 INDEX</text><text x="28" y="92" fill="#211a2c" font-size="23" font-weight="700">搜索与统计</text><text x="28" y="132" fill="#6d6478" font-size="16">索引新鲜？</text><text x="28" y="164" fill="#6d6478" font-size="16">筛选母集正确？</text><text x="28" y="196" fill="#6d6478" font-size="16">字段有证据？</text></g>
    <path d="M772 262h32" stroke="#9b8bb4" stroke-width="3"/><path d="m796 254 12 8-12 8" fill="none" stroke="#9b8bb4" stroke-width="3"/>
    <g transform="translate(820 145)"><rect width="145" height="235" rx="22" fill="#fff" stroke="#ded8e8"/><text x="24" y="48" fill="#6d28d9" font-size="14" font-weight="700">04 VIEW</text><text x="24" y="92" fill="#211a2c" font-size="23" font-weight="700">界面</text><text x="24" y="132" fill="#6d6478" font-size="16">Lens？</text><text x="24" y="164" fill="#6d6478" font-size="16">筛选？</text><text x="24" y="196" fill="#6d6478" font-size="16">详情降级？</text></g>
    <path d="M977 262h32" stroke="#9b8bb4" stroke-width="3"/><path d="m1001 254 12 8-12 8" fill="none" stroke="#9b8bb4" stroke-width="3"/>
    <g transform="translate(1025 145)"><rect width="105" height="235" rx="22" fill="#fff7ed" stroke="#fed7aa"/><text x="18" y="48" fill="#c2410c" font-size="14" font-weight="700">05 ACTION</text><text x="18" y="92" fill="#7c2d12" font-size="21" font-weight="700">行动</text><text x="18" y="132" fill="#9a3412" font-size="15">Resume</text><text x="18" y="164" fill="#9a3412" font-size="15">SSH</text><text x="18" y="196" fill="#9a3412" font-size="15">恢复</text></g>
  </g>
  <text x="70" y="450" fill="#6d6478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">不要先清空 Library、删除锁文件或全库重建；先用 Diagnostics / doctor 获取只读证据。</text>
</svg>
