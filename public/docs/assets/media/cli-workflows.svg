<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Swob CLI 的四类工作流</title>
  <desc id="desc">Swob CLI 可以用于查找和继续、读取和交接、批量整理、诊断和修复。</desc>
  <rect width="1200" height="420" rx="28" fill="#17151b"/>
  <text x="64" y="70" fill="#f4f0f7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="700">CLI 不是另一套界面，而是 Swob 的机器控制面</text>
  <text x="64" y="108" fill="#aaa2b5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">先按任务选择工作流，需要精确参数时再查命令参考</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(64 158)">
      <rect width="250" height="194" rx="18" fill="#231f29" stroke="#433a4d"/>
      <text x="24" y="42" fill="#c4b5fd" font-size="16" font-weight="700">FIND &amp; CONTINUE</text>
      <text x="24" y="82" fill="#f4f0f7" font-size="23" font-weight="650">找回并继续</text>
      <text x="24" y="120" fill="#aaa2b5" font-size="16">grep → show → resume</text>
      <text x="24" y="151" fill="#aaa2b5" font-size="15">从一句原文回到会话</text>
    </g>
    <g transform="translate(338 158)">
      <rect width="250" height="194" rx="18" fill="#231f29" stroke="#433a4d"/>
      <text x="24" y="42" fill="#93c5fd" font-size="16" font-weight="700">READ &amp; HAND OFF</text>
      <text x="24" y="82" fill="#f4f0f7" font-size="23" font-weight="650">读取并交接</text>
      <text x="24" y="120" fill="#aaa2b5" font-size="16">where → show --full</text>
      <text x="24" y="151" fill="#aaa2b5" font-size="15">给脚本或 Agent 结构化证据</text>
    </g>
    <g transform="translate(612 158)">
      <rect width="250" height="194" rx="18" fill="#231f29" stroke="#433a4d"/>
      <text x="24" y="42" fill="#86efac" font-size="16" font-weight="700">ORGANIZE SAFELY</text>
      <text x="24" y="82" fill="#f4f0f7" font-size="23" font-weight="650">安全批量整理</text>
      <text x="24" y="120" fill="#aaa2b5" font-size="16">move / rename → undo</text>
      <text x="24" y="151" fill="#aaa2b5" font-size="15">整批校验、一次提交、可撤销</text>
    </g>
    <g transform="translate(886 158)">
      <rect width="250" height="194" rx="18" fill="#281f2a" stroke="#7f1d1d"/>
      <text x="24" y="42" fill="#fca5a5" font-size="16" font-weight="700">DIAGNOSE FIRST</text>
      <text x="24" y="82" fill="#f4f0f7" font-size="23" font-weight="650">先诊断再修复</text>
      <text x="24" y="120" fill="#aaa2b5" font-size="16">doctor → status → rebuild</text>
      <text x="24" y="151" fill="#aaa2b5" font-size="15">先只读，重建前先 dry-run</text>
    </g>
  </g>
</svg>
