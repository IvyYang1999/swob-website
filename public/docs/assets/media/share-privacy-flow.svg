<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">从会话选择内容并安全分享</title>
  <desc id="desc">选择问答、预览内容、检查隐私、复制或保存 PNG 的流程。</desc>
  <rect width="1200" height="460" rx="32" fill="#fbf9ff"/>
  <text x="70" y="78" fill="#211a2c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">分享前，先把“要说什么”和“不该带走什么”分开</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">
    <rect x="70" y="155" width="245" height="210" rx="22" fill="#fff" stroke="#ded8e8"/>
    <text x="100" y="202" fill="#6d28d9" font-size="15" font-weight="700">SELECT</text><text x="100" y="246" fill="#211a2c" font-size="25" font-weight="700">逐条选择问与答</text>
    <text x="100" y="286" fill="#6d6478">复制或下载 Markdown</text><text x="100" y="320" fill="#6d6478">也可进入分享预览</text>
    <path d="M335 260h54" stroke="#9b8bb4" stroke-width="3"/><path d="m381 252 12 8-12 8" fill="none" stroke="#9b8bb4" stroke-width="3"/>
    <rect x="410" y="155" width="245" height="210" rx="22" fill="#fff" stroke="#ded8e8"/>
    <text x="440" y="202" fill="#6d28d9" font-size="15" font-weight="700">PREVIEW</text><text x="440" y="246" fill="#211a2c" font-size="25" font-weight="700">选择主题与水印</text>
    <text x="440" y="286" fill="#6d6478">长内容自动分页</text><text x="440" y="320" fill="#6d6478">先看最终图再导出</text>
    <path d="M675 260h54" stroke="#9b8bb4" stroke-width="3"/><path d="m721 252 12 8-12 8" fill="none" stroke="#9b8bb4" stroke-width="3"/>
    <rect x="750" y="145" width="260" height="230" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="780" y="192" fill="#c2410c" font-size="15" font-weight="700">PRIVACY GATE</text><text x="780" y="236" fill="#7c2d12" font-size="25" font-weight="700">人工检查秘密</text>
    <text x="780" y="278" fill="#9a3412">路径 / Session ID 默认隐藏</text><text x="780" y="312" fill="#9a3412">自动告警不是泄漏证明</text><text x="780" y="346" fill="#9a3412">仍需逐页阅读</text>
    <path d="M1030 260h38" stroke="#9b8bb4" stroke-width="3"/><path d="m1060 252 12 8-12 8" fill="none" stroke="#9b8bb4" stroke-width="3"/>
    <rect x="1090" y="190" width="60" height="140" rx="18" fill="#dcfce7" stroke="#86efac"/>
    <text x="1110" y="235" fill="#15803d" font-size="16" font-weight="700">COPY</text><text x="1104" y="270" fill="#15803d" font-size="16" font-weight="700">SAVE</text><text x="1110" y="305" fill="#15803d" font-size="16" font-weight="700">PNG</text>
  </g>
</svg>
