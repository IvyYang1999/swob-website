<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Swob SSH 远程 Resume 流程</title>
  <desc id="desc">本机 Swob 使用已有 SSH 配置连接远程主机，在远端工作目录启动 Claude Code 并恢复指定会话。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17151b"/><stop offset="1" stop-color="#1b2230"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" fill="#f4f0f7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="700">Swob 负责编排，SSH 负责认证，远端 CLI 负责恢复</text>
  <text x="64" y="108" fill="#aaa2b5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">SSH 设置不会扫描远端硬盘，也不会接管你的私钥</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(64 158)">
      <rect width="250" height="130" rx="18" fill="#26212d" stroke="#4d4258"/>
      <text x="24" y="45" fill="#c4b5fd" font-size="16" font-weight="700">LOCAL</text>
      <text x="24" y="83" fill="#f4f0f7" font-size="23" font-weight="650">Swob 选择会话</text>
      <text x="24" y="110" fill="#aaa2b5" font-size="15">session ID + remote cwd</text>
    </g>
    <path d="M330 223h116" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/><path d="m434 213 12 10-12 10" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <text x="388" y="205" text-anchor="middle" fill="#aaa2b5" font-size="15">已有 SSH config / agent</text>
    <g transform="translate(462 158)">
      <rect width="276" height="130" rx="18" fill="#222733" stroke="#41526c"/>
      <text x="24" y="45" fill="#93c5fd" font-size="16" font-weight="700">REMOTE HOST</text>
      <text x="24" y="83" fill="#f4f0f7" font-size="23" font-weight="650">进入远端工作目录</text>
      <text x="24" y="110" fill="#aaa2b5" font-size="15">zsh -li → cd &lt;remote-cwd&gt;</text>
    </g>
    <path d="M754 223h116" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/><path d="m858 213 12 10-12 10" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <text x="812" y="205" text-anchor="middle" fill="#aaa2b5" font-size="15">启动已安装 CLI</text>
    <g transform="translate(886 158)">
      <rect width="250" height="130" rx="18" fill="#202b27" stroke="#36604d"/>
      <text x="24" y="45" fill="#86efac" font-size="16" font-weight="700">VERIFY</text>
      <text x="24" y="83" fill="#f4f0f7" font-size="23" font-weight="650">恢复并核对会话</text>
      <text x="24" y="110" fill="#aaa2b5" font-size="15">claude --resume &lt;id&gt;</text>
    </g>
  </g>
</svg>
