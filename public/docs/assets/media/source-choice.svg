<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">按任务判断数据源能力</title>
  <desc id="desc">从能否发现会话开始，依次检查正文、用量、关系和续接能力。</desc>
  <rect width="1200" height="520" rx="32" fill="#faf8ff"/>
  <text x="70" y="76" fill="#211a2c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">不要问“支不支持”，先问“我要完成什么”</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="70" y="145" width="220" height="250" rx="22" fill="#fff" stroke="#ded8e8"/>
    <text x="100" y="194" fill="#6d28d9" font-size="15" font-weight="700">DISCOVER</text><text x="100" y="236" fill="#211a2c" font-size="24" font-weight="700">找得到吗？</text>
    <text x="100" y="278" fill="#6d6478" font-size="17">发现与摘要</text><text x="100" y="310" fill="#6d6478" font-size="17">是所有后续能力的入口</text>
    <text x="100" y="358" fill="#15803d" font-size="16" font-weight="700">● 可用 → 继续判断</text>
    <path d="M310 270h45" stroke="#9b8bb4" stroke-width="3"/><path d="m347 262 12 8-12 8" fill="none" stroke="#9b8bb4" stroke-width="3"/>
    <rect x="375" y="145" width="220" height="250" rx="22" fill="#fff" stroke="#ded8e8"/>
    <text x="405" y="194" fill="#6d28d9" font-size="15" font-weight="700">READ</text><text x="405" y="236" fill="#211a2c" font-size="24" font-weight="700">看得到什么？</text>
    <text x="405" y="278" fill="#6d6478" font-size="17">正文 / 工具 / Thinking</text><text x="405" y="310" fill="#6d6478" font-size="17">缺失字段不等于空值</text>
    <text x="405" y="358" fill="#c2410c" font-size="16" font-weight="700">◐ 先看来源版本</text>
    <path d="M615 270h45" stroke="#9b8bb4" stroke-width="3"/><path d="m652 262 12 8-12 8" fill="none" stroke="#9b8bb4" stroke-width="3"/>
    <rect x="680" y="145" width="220" height="250" rx="22" fill="#fff" stroke="#ded8e8"/>
    <text x="710" y="194" fill="#6d28d9" font-size="15" font-weight="700">UNDERSTAND</text><text x="710" y="236" fill="#211a2c" font-size="24" font-weight="700">能否比较？</text>
    <text x="710" y="278" fill="#6d6478" font-size="17">用量 / 关系 / 子 Agent</text><text x="710" y="310" fill="#6d6478" font-size="17">证据等级可能不同</text>
    <text x="710" y="358" fill="#6d6478" font-size="16" font-weight="700">— 不可用 ≠ 0</text>
    <path d="M920 270h45" stroke="#9b8bb4" stroke-width="3"/><path d="m957 262 12 8-12 8" fill="none" stroke="#9b8bb4" stroke-width="3"/>
    <rect x="985" y="145" width="145" height="250" rx="22" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="1015" y="194" fill="#6d28d9" font-size="15" font-weight="700">CONTINUE</text><text x="1015" y="236" fill="#3b1d6b" font-size="24" font-weight="700">怎么续接？</text>
    <text x="1015" y="278" fill="#5b3d82" font-size="17">终端命令</text><text x="1015" y="310" fill="#5b3d82" font-size="17">或原生入口</text>
    <text x="1015" y="358" fill="#6d28d9" font-size="16" font-weight="700">必须实机核对</text>
  </g>
  <text x="70" y="460" fill="#6d6478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">矩阵里的 ● / ◐ / — 分别表示可用、实验或有条件、不可用或不适用。</text>
</svg>
