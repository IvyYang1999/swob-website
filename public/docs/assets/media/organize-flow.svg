<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Swob 安全整理流程</title>
  <desc id="desc">从选择整理方式、检查预览、提交事务到必要时撤销的四步流程。</desc>
  <rect width="1200" height="460" rx="32" fill="#faf8ff"/>
  <text x="70" y="78" fill="#211a2c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">整理的关键不是移动，而是先看清、能撤销</text>
  <text x="70" y="116" fill="#6d6478" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">项目整理不联网；智能整理需要已绑定的 AI Profile。</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(70 165)">
      <rect width="230" height="210" rx="22" fill="#fff" stroke="#ded8e8"/>
      <circle cx="38" cy="40" r="20" fill="#ede9fe"/><text x="31" y="47" fill="#6d28d9" font-size="20" font-weight="700">1</text>
      <text x="28" y="92" fill="#211a2c" font-size="23" font-weight="700">选择方式</text>
      <text x="28" y="128" fill="#6d6478" font-size="17">按项目归档</text><text x="28" y="158" fill="#6d6478" font-size="17">或 AI 智能建议</text>
    </g>
    <path d="M320 270h48" stroke="#9b8bb4" stroke-width="3"/><path d="m360 262 12 8-12 8" fill="none" stroke="#9b8bb4" stroke-width="3"/>
    <g transform="translate(390 165)">
      <rect width="230" height="210" rx="22" fill="#fff" stroke="#ded8e8"/>
      <circle cx="38" cy="40" r="20" fill="#ede9fe"/><text x="31" y="47" fill="#6d28d9" font-size="20" font-weight="700">2</text>
      <text x="28" y="92" fill="#211a2c" font-size="23" font-weight="700">检查预览</text>
      <text x="28" y="128" fill="#6d6478" font-size="17">取消不想移动的项</text><text x="28" y="158" fill="#6d6478" font-size="17">修正目标文件夹</text>
    </g>
    <path d="M640 270h48" stroke="#9b8bb4" stroke-width="3"/><path d="m680 262 12 8-12 8" fill="none" stroke="#9b8bb4" stroke-width="3"/>
    <g transform="translate(710 165)">
      <rect width="230" height="210" rx="22" fill="#fff" stroke="#ded8e8"/>
      <circle cx="38" cy="40" r="20" fill="#dcfce7"/><text x="31" y="47" fill="#15803d" font-size="20" font-weight="700">3</text>
      <text x="28" y="92" fill="#211a2c" font-size="23" font-weight="700">提交事务</text>
      <text x="28" y="128" fill="#6d6478" font-size="17">整批先校验</text><text x="28" y="158" fill="#6d6478" font-size="17">再写入 Library</text>
    </g>
    <path d="M960 270h48" stroke="#9b8bb4" stroke-width="3"/><path d="m1000 262 12 8-12 8" fill="none" stroke="#9b8bb4" stroke-width="3"/>
    <g transform="translate(1030 165)">
      <rect width="100" height="210" rx="22" fill="#fff7ed" stroke="#fed7aa"/>
      <circle cx="34" cy="40" r="20" fill="#ffedd5"/><text x="27" y="47" fill="#c2410c" font-size="20" font-weight="700">4</text>
      <text x="20" y="96" fill="#7c2d12" font-size="19" font-weight="700">撤销</text>
      <text x="20" y="132" fill="#9a3412" font-size="15">仅最近</text><text x="20" y="156" fill="#9a3412" font-size="15">一笔</text>
    </g>
  </g>
</svg>
